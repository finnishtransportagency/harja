name: '[Test-envs] Deploy'

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      keep-running:
        required: true
        type: boolean
      skip-migrations:
        required: true
        type: boolean
      service-arn:
        required: true
        type: string
      commit-sha:
        required: true
        type: string
      ref-tag:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 60

    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      - name: '[Test-envs] Checkout code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '[Test-envs] Download build artifact'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: harja-build-${{ github.run_id }}
          path: build-artifact

      - name: '[Test-envs] Restore build artifact'
        run: tar -xzf build-artifact/harja-build.tar.gz

      - name: Assume role with OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: 'eu-west-1'
          role-to-assume: 'arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/cicd-github-harja-app-admin'
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      # https://github.com/aws-actions/amazon-ecr-login
      # mask-password: 'true' käyttö on suositeltavaa, jotta docker-salasanaa ei tulosteta mikäli debug-lokitus on enabloitu.
      # Huomioi kuitenkin, että docker salasanan jakaminen jobien välillä ei onnistu mikäli se maskataan.
      - name: '[Test-envs] Authenticate with AWS ECR'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          mask-password: 'true'

      - name: '[Test-envs] Build and tag Harja Docker image'
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
          REF_TAG: ${{ inputs.ref-tag }}
          COMMIT_SHA: ${{ inputs.commit-sha }}
          DOCKERFILE_PATH: 'aws/fargate/Dockerfile'
        run: |
          docker build --provenance=false \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$REF_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$COMMIT_SHA" \
            --file "$DOCKERFILE_PATH" .

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$REF_TAG" >> "$GITHUB_OUTPUT"

      # Käynnistä tietokanta jos ei ole jo käynnissä
      # Testiympäristön RDS-klusteri voi olla myös kokonaan pysäytettynä, joten odota että se on käytettävissä ennen migraatioita.
      # Kirjoitushetkellä käytetään serverless v2 auto-stoppia, mutta pidetään chekki tämä silti
      - name: '[Test-envs] Start Aurora database'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          DB_CLUSTER="harja-test-db-${ENVIRONMENT#test-}"
          echo "Checking RDS cluster: $DB_CLUSTER"

          STATUS=$(aws rds describe-db-clusters \
            --region eu-west-1 \
            --db-cluster-identifier "$DB_CLUSTER" \
            --query 'DBClusters[0].Status' \
            --output text)

          echo "RDS Cluster status: $STATUS"

          if [ "$STATUS" = "stopped" ]; then
            echo "Starting $DB_CLUSTER..."
            aws rds start-db-cluster \
              --region eu-west-1 \
              --db-cluster-identifier "$DB_CLUSTER" \
              --no-cli-pager > /dev/null
          fi

          while true; do
            STATUS=$(aws rds describe-db-clusters \
              --region eu-west-1 \
              --db-cluster-identifier "$DB_CLUSTER" \
              --query 'DBClusters[0].Status' \
              --output text)

            echo "Waiting to start.. RDS Cluster status: $STATUS"

            if [ "$STATUS" = "available" ]; then
              echo "Done, $DB_CLUSTER is running"
              break
            fi

            sleep 10
          done

      - name: '[Test-envs] Run migrations'
        if: ${{ !inputs.skip-migrations }}
        uses: ./.github/actions/run-migrations-to-test-env
        with:
          commit-sha: ${{ inputs.commit-sha }}
          function-name: HarjaTestMigrationRunner-${{ inputs.environment }}

      - name: '[Test-envs] Push image to ECR'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
          REF_TAG: ${{ inputs.ref-tag }}
          COMMIT_SHA: ${{ inputs.commit-sha }}
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$REF_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$COMMIT_SHA"

      - name: '[Test-envs] Download task definition'
        env:
          ECS_TASK_DEFINITION_NAME: ${{ vars.ECS_TASK_DEFINITION_NAME }}
        run: |
          aws ecs describe-task-definition \
            --region eu-west-1 \
            --task-definition "$ECS_TASK_DEFINITION_NAME" \
            --query taskDefinition \
            > harja-task-definition.json

      - name: Update ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
        with:
          task-definition: harja-task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_NAME }}
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          wait-for-service-stability: false

      - name: '[Test-envs] Start ECS service'
        env:
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME }}
        run: |
          aws ecs update-service \
            --region eu-west-1 \
            --cluster "$ECS_CLUSTER_NAME" \
            --service "$ECS_SERVICE_NAME" \
            --desired-count 1

      - name: '[Test-envs] Configure automatic stop'
        env:
          SERVICE_ARN: ${{ inputs.service-arn }}
          ECS_SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME }}
          KEEP_RUNNING: ${{ inputs.keep-running }}
        run: |
          if [ "$KEEP_RUNNING" = "true" ]; then
            echo "Disabling automatic stop for $ECS_SERVICE_NAME"

            aws ecs tag-resource \
              --region eu-west-1 \
              --resource-arn "$SERVICE_ARN" \
              --tags key=HARJA_AUTOSS_IGNORE,value=true
          else
            echo "Enabling automatic stop for $ECS_SERVICE_NAME"

            aws ecs untag-resource \
              --region eu-west-1 \
              --resource-arn "$SERVICE_ARN" \
              --tag-keys HARJA_AUTOSS_IGNORE
          fi
