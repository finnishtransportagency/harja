## Testiympäristöjen preflight
## Ennen kun siirrytään buildeihin ja migraatioihin, tarkistetaan AWS resurssit
## Katsotaan myöhemmin, jos tehdään dynaamisempi source-of-truth
name: '[Test-envs] Preflight'

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    outputs:
      service_arn:
        description: ECS service ARN for the selected test environment
        value: ${{ jobs.preflight.outputs.service_arn }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    timeout-minutes: 10

    permissions:
      id-token: write
      contents: read

    outputs:
      service_arn: ${{ steps.preflight.outputs.service_arn }}

    steps:
      - name: Assume role with OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: 'eu-west-1'
          role-to-assume: 'arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/cicd-github-harja-app-admin'
          role-duration-seconds: 900
          role-skip-session-tagging: true

      # Varmista ennen buildia, että valitun testiympäristön ECS-resurssit ovat olemassa
      # Kaikki testiympäristöt eivät ole välttämättä deployattuna infrassa, sekä loogiset ID:t voivat muuttua
      - name: '[Test-envs] Preflight deployment target'
        id: preflight
        env:
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME }}
          ECS_TASK_DEFINITION_NAME: ${{ vars.ECS_TASK_DEFINITION_NAME }}
          ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
        run: |
          if ! SERVICE_ARN=$(aws ecs describe-services \
            --region eu-west-1 \
            --cluster "$ECS_CLUSTER_NAME" \
            --services "$ECS_SERVICE_NAME" \
            --query 'services[0].serviceArn' \
            --output text 2>aws-error.txt); then
            ERROR=$(cat aws-error.txt)

            if echo "$ERROR" | grep -q 'ClusterNotFoundException'; then
              echo "ECS cluster does not exist: $ECS_CLUSTER_NAME"
            else
              echo "Failed to describe ECS service:"
              echo "$ERROR"
            fi

            exit 1
          fi

          if [ "$SERVICE_ARN" = "None" ] || [ -z "$SERVICE_ARN" ]; then
            echo "ECS service does not exist: $ECS_SERVICE_NAME"
            exit 1
          fi

          if ! CONTAINER=$(aws ecs describe-task-definition \
            --region eu-west-1 \
            --task-definition "$ECS_TASK_DEFINITION_NAME" \
            --query "taskDefinition.containerDefinitions[?name=='$ECS_CONTAINER_NAME'].name | [0]" \
            --output text 2>aws-error.txt); then
            ERROR=$(cat aws-error.txt)

            if echo "$ERROR" | grep -q 'ClientException' && \
              echo "$ERROR" | grep -q 'Unable to describe task definition'; then
              echo "ECS task definition does not exist: $ECS_TASK_DEFINITION_NAME"
            else
              echo "Failed to describe ECS task definition:"
              echo "$ERROR"
            fi

            exit 1
          fi

          if [ "$CONTAINER" != "$ECS_CONTAINER_NAME" ]; then
            echo "Container does not exist in task definition: $ECS_CONTAINER_NAME"
            exit 1
          fi
