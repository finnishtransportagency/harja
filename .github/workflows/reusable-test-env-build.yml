## Testiympäristöjen appiksen buildi
## Pidetään erillään pääympäristöistä, näille on oma tägäys, 
## sekä voivat tulevaisuudessa muuttua tarpeiden mukaan
name: '[Test-envs] Build'

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    outputs:
      commit_sha:
        description: Checked out commit SHA
        value: ${{ jobs.build.outputs.commit_sha }}
      ref_tag:
        description: Sanitized image tag
        value: ${{ jobs.build.outputs.ref_tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: read

    outputs:
      commit_sha: ${{ steps.git-sha.outputs.sha }}
      ref_tag: ${{ steps.ref-tag.outputs.ref_tag }}

    steps:
      - name: '[Test-envs] Checkout code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Buildi tarvitsee paikallisen tietokannan, mutta ei AWS-tunnuksia
      - name: '[Test-envs] Start database for build'
        uses: ./.github/actions/start-test-db
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          service-name: harjadb-latest

      # rev-parse == commit
      - name: '[Test-envs] Resolve checked out commit'
        id: git-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # ref_name == branchi
      # Tagataan image branchilla ja testiympäristöllä
      - name: '[Test-envs] Resolve sanitized ref tag'
        id: ref-tag
        env:
          RAW_REF: ${{ github.ref_name }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          REF_TAG=$(echo "$RAW_REF-$ENVIRONMENT" | sed 's/[^a-zA-Z0-9]/-/g')
          echo "ref_tag=$REF_TAG" >> "$GITHUB_OUTPUT"

      - name: '[Test-envs] Build Harja Uberjar'
        uses: ./.github/actions/build-harja-app
        with:
          build-laadunseuranta: 'false'

      # Deploy-job ajetaan eri runnerissa, joten build-output pitää siirtää artifaktina
      - name: '[Test-envs] Package build artifact'
        run: tar -czf harja-build.tar.gz target

      - name: '[Test-envs] Upload build artifact'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harja-build-${{ github.run_id }}
          path: harja-build.tar.gz
          if-no-files-found: error
          retention-days: 1
