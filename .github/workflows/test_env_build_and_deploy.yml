## Testiympäristöjen deployment prosessi
## -> antaa valita branchin
## -> tarkistaa deployment-kohteen ennen buildia
## -> buildaa uberjarin ilman AWS-tunnuksia
## -> ajaa tietokantamigraatiot rinnakkain buildin kanssa (nopeuttaa prosessia)
## -> buildaa imagen testi ECR:rään (erillään prodista), pushaa vain commit-SHA-tagilla
## -> siirtää branch-tagin imagelle ja deployaa imagen <test-env> ECS konttiin SHA-tagilla
## -> raportoi, jos kanta migroitiin mutta sovellusta ei deployattu
##
##  Kuvaus jobien välisistä riippuvuuksista:
##   preflight ─┬─ build ── image ─┬─ deploy
##              └─ database ───────┘
##                                  report (vain virhetilanteissa)
name: '[Test-envs] Build and deploy'

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Valitse deploy-ympäristö"
        required: true
        type: choice
        options:
          - test-qa1
          - test-qa2
          - test-qa3
          - test-demo
          - test-koulutus
      build-mode:
        description: "Valitse build-mode"
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview
      keep-running:
        description: "Pidä ympäristö käynnissä yön yli?"
        required: true
        type: boolean
        default: false
      skip-migrations:
        description: "Ohita Flyway-migraatiot?"
        required: true
        type: boolean
        default: false

run-name: '[Test-envs] Build and deploy: ${{ inputs.environment }} (${{ inputs.build-mode }})'

concurrency:
  group: ${{ inputs.environment }}-deploy
  cancel-in-progress: false

# Aseta least-privilege default permissionit workflowille
# Job-kohtaiset oikeudet määritellään jobeissa erikseen
permissions: {}

jobs:

  preflight:
    name: "Preflight ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    timeout-minutes: 10

    permissions:
      id-token: write
      contents: read

    # Kaikki jobit käyttävät näitä samoja outputteja,
    # jotta build, image ja migraatio vaiheet viittaavat varmasti samaan committiin
    outputs:
      commit_sha: ${{ github.sha }}
      ref_tag: ${{ steps.ref-tag.outputs.ref_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ref_name == branchi
      # Tagataan image branchilla ja testiympäristöllä
      - name: '[Test-envs] Resolve sanitized ref tag'
        id: ref-tag
        env:
          RAW_REF: ${{ github.ref_name }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          REF_TAG=$(echo "$RAW_REF-$ENVIRONMENT" | sed 's/[^a-zA-Z0-9]/-/g')
          echo "ref_tag=$REF_TAG" >> "$GITHUB_OUTPUT"

      - name: Assume role with OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: 'eu-west-1'
          role-to-assume: 'arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/cicd-github-harja-app-admin'
          role-duration-seconds: 900
          role-skip-session-tagging: true

      # Varmista ennen buildia, että valitun testiympäristön ECS-resurssit ovat olemassa
      # Kaikki testiympäristöt eivät ole välttämättä deployattuna infrassa, sekä loogiset ID:t voivat muuttua
      - name: '[Test-envs] Preflight deployment target'
        uses: ./.github/actions/verify-ecs-deployment-target
        with:
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          service: ${{ vars.ECS_SERVICE_NAME }}
          task-definition: ${{ vars.ECS_TASK_DEFINITION_NAME }}
          container: ${{ vars.ECS_CONTAINER_NAME }}
          region: eu-west-1

  build:
    name: "Build branch for ${{ inputs.environment }}"
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: read

    steps:
      - name: '[Test-envs] Checkout code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Migraatio ajetaan preflightin commit_sha:lla, joten buildin täytyy käyttää samaa committia
      - name: '[Test-envs] Verify checked out commit'
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.commit_sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out commit $ACTUAL_SHA differs from preflight commit $EXPECTED_SHA"
            exit 1
          fi
          echo "Build commit verified: $ACTUAL_SHA"

      # Build tarvitsee vain paikallisen tietokannan skeeman, mutta ei testidataa eikä AWS-tunnuksia
      - name: '[Test-envs] Start database for build'
        uses: ./.github/actions/start-test-db
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          service-name: harjadb-latest
          skip-testdata: 'true'

      - name: '[Test-envs] Build Harja Uberjar'
        uses: ./.github/actions/build-harja-app
        with:
          build-mode: ${{ inputs.build-mode }}
          build-laadunseuranta: 'false'
          build-uberjar: 'true'

      # Image-job ajetaan eri runnerissa, joten buildattu uberjar pitää siirtää jobille artifactina
      - name: '[Test-envs] Upload build artifact'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harja-uberjar-${{ github.run_id }}
          path: ./target/harja-0.0.1-SNAPSHOT-standalone.jar
          if-no-files-found: error
          retention-days: 1

  # Rakentaa imagen ja pushaa sen VAIN commit-SHA-tagilla.
  # Branch-tagia (REF_TAG) ei pushata tässä, koska migraatio voi olla vielä kesken rinnakkaisessa database-jobissa.
  # Jos REF_TAG osoittaisi uuteen imageen ennen migraatiota, ECS:n seuraava taskin käynnistys
  # (esim. auto-stopin jälkeen) voisi ajaa uutta sovellusta migroimatonta kantaa vasten.
  # Image buildataan ja pushataan erillään, koska app build-jobissa ei käytetä AWS-tunnuksia (tietoturva).
  image:
    name: "Build and push image for ${{ inputs.environment }}"
    needs:
      - preflight
      - build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    timeout-minutes: 30

    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      - name: '[Test-envs] Checkout code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '[Test-envs] Download build artifact'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: harja-uberjar-${{ github.run_id }}
          # Pura samaan kansioon, kuin mitä Dockerfilessä odotetaan
          path: ./target

      - name: Assume role with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: 'eu-west-1'
          role-to-assume: 'arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/cicd-github-harja-app-admin'
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      # https://github.com/aws-actions/amazon-ecr-login
      # mask-password: 'true' käyttö on suositeltavaa, jotta docker-salasanaa ei tulosteta mikäli debug-lokitus on enabloitu.
      # Huomioi kuitenkin, että docker salasanan jakaminen jobien välillä ei onnistu mikäli se maskataan.
      - name: '[Test-envs] Authenticate with AWS ECR'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          mask-password: 'true'

      - name: '[Test-envs] Build Harja Docker image'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
          COMMIT_SHA: ${{ needs.preflight.outputs.commit_sha }}
          DOCKERFILE_PATH: 'aws/fargate/Dockerfile'
        run: |
          docker build --provenance=false \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$COMMIT_SHA" \
            --file "$DOCKERFILE_PATH" .

      - name: '[Test-envs] Push image to ECR (commit SHA tag only)'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
          COMMIT_SHA: ${{ needs.preflight.outputs.commit_sha }}
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$COMMIT_SHA"

  # Tämä ajetaan rinnakkain buildin kanssa.
  # Hox: Testiympäristöjen suhteen voidaan sallia hiukan riskisempi rinnakkainen ajo ja nopeuttaa workflowta.
  # Jos jotain ongelmia ilmenee, voi kehittäjä vain tehdä uuden korjaavan deploymentin.
  # Jobi ajetaan _aina_ (myös skip-migrations-tilassa), koska app tarvitsee toimiakseen käynnissä olevan kannan.
  #
  # HUOM: Tätä jobia EI saa peruuttaa kesken migraation. Jobin peruutus ei pysäytä Lambdaa pilvessä,
  #       vaan Flyway-ajo jatkuu taustalla. Tällöin myöskään report-job ei tiedä migraation tilaa.
  #       Uudelleenajo on turvallinen, kunhan Lambda on tehnyt työnsä loppuun.
  database:
    name: "Prepare database for ${{ inputs.environment }}"
    needs: preflight
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    # Pidempi kuin migraatio-Lambdan 900 sekunnin aikakatkaisu + mahdollinen Auroran käynnistys täysin stopped-tilasta
    timeout-minutes: 30

    permissions:
      id-token: write
      contents: read

    # migrated=true julkaistaan vasta, kun Lambda on palauttanut onnistuneen tuloksen
    outputs:
      migrated: ${{ steps.migration-result.outputs.migrated }}

    steps:
      - name: '[Test-envs] Checkout code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assume role with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: 'eu-west-1'
          role-to-assume: 'arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/cicd-github-harja-app-admin'
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      # Käynnistä tietokanta jos ei ole jo käynnissä
      # Testiympäristön RDS-klusteri voi olla myös kokonaan pysäytettynä, joten odota että se on käytettävissä ennen migraatioita.
      # Kirjoitushetkellä käytetään serverless v2 auto-stoppia, mutta pidetään chekki tämä silti
      - name: '[Test-envs] Start Aurora database'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          DB_CLUSTER="harja-test-db-${ENVIRONMENT#test-}"
          echo "Checking RDS cluster: $DB_CLUSTER"

          STATUS=$(aws rds describe-db-clusters \
            --region eu-west-1 \
            --db-cluster-identifier "$DB_CLUSTER" \
            --query 'DBClusters[0].Status' \
            --output text)

          echo "RDS Cluster status: $STATUS"

          if [ "$STATUS" = "stopped" ]; then
            echo "Starting $DB_CLUSTER..."
            aws rds start-db-cluster \
              --region eu-west-1 \
              --db-cluster-identifier "$DB_CLUSTER" \
              --no-cli-pager > /dev/null
          fi

          while true; do
            STATUS=$(aws rds describe-db-clusters \
              --region eu-west-1 \
              --db-cluster-identifier "$DB_CLUSTER" \
              --query 'DBClusters[0].Status' \
              --output text)

            echo "Waiting to start.. RDS Cluster status: $STATUS"

            if [ "$STATUS" = "available" ]; then
              echo "Done, $DB_CLUSTER is running"
              break
            fi

            sleep 10
          done

      - name: '[Test-envs] Run migrations'
        if: ${{ !inputs.skip-migrations }}
        uses: ./.github/actions/run-migrations-to-test-env
        with:
          commit-sha: ${{ needs.preflight.outputs.commit_sha }}
          function-name: HarjaTestMigrationRunner-${{ inputs.environment }}

      # Ajetaan vain, jos edellinen migraatio-steppi onnistui
      - name: '[Test-envs] Mark database as migrated'
        id: migration-result
        if: ${{ !inputs.skip-migrations }}
        run: echo "migrated=true" >> "$GITHUB_OUTPUT"

  # Ajetaan lopuksi vain, kun image-, database- ja preflight- jobit ovat onnistuneet
  deploy:
    name: "Deploy branch to ${{ inputs.environment }}"
    needs:
      - preflight
      - image
      - database
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 60

    permissions:
      id-token: write
      contents: read

    steps:
      - name: '[Test-envs] Checkout code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assume role with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: 'eu-west-1'
          role-to-assume: 'arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/cicd-github-harja-app-admin'
          role-duration-seconds: 3600
          role-skip-session-tagging: true

      # ECR URL sisältää AWS-tilin ID:n (joka on secret repossa, joten GitHub sensuroi sen job-outputeista).
      # Siksi image-URI muodostetaan tässä jobissa, eikä sitä tuoda image-jobista.
      - name: '[Test-envs] Authenticate with AWS ECR'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          mask-password: 'true'

      # Pushaa branch-tagi (REF_TAG) jo pushattuun Commit SHA-tagattuun imageen.
      # Tämä tehdään vasta migraation jälkeen, jotta REF_TAG ei koskaan osoita migroimatonta kantaa vastaan.
      # Dockerin `imagetools create` kopioi vain imagen manifestin (sama digest), ei tarvita erillistä `docker pull`-vaihetta.
      - name: '[Test-envs] Push ref tag'
        id: image-uri
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
          REF_TAG: ${{ needs.preflight.outputs.ref_tag }}
          COMMIT_SHA: ${{ needs.preflight.outputs.commit_sha }}
        run: |
          docker buildx imagetools create \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$REF_TAG" \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$COMMIT_SHA"

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: '[Test-envs] Download task definition'
        env:
          ECS_TASK_DEFINITION_NAME: ${{ vars.ECS_TASK_DEFINITION_NAME }}
        run: |
          aws ecs describe-task-definition \
            --region eu-west-1 \
            --task-definition "$ECS_TASK_DEFINITION_NAME" \
            --query taskDefinition \
            > harja-task-definition.json

      - name: Update ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
        with:
          task-definition: harja-task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ steps.image-uri.outputs.image }}

      - name: Deploy ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_NAME }}
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          wait-for-service-stability: false

      - name: '[Test-envs] Start ECS Fargate tasks'
        uses: ./.github/actions/start-fargate-tasks
        timeout-minutes: 10
        with:
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          service: ${{ vars.ECS_SERVICE_NAME }}
          # Ohita ECS service-stability check
          check-stability: 'false'

      - name: '[Test-envs] Configure automatic stop'
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
          ECS_SERVICE_NAME: ${{ vars.ECS_SERVICE_NAME }}
          KEEP_RUNNING: ${{ inputs.keep-running }}
        run: |
          SERVICE_ARN="arn:aws:ecs:eu-west-1:${AWS_ACCOUNT_ID}:service/${ECS_CLUSTER_NAME}/${ECS_SERVICE_NAME}"
          
          if [ "$KEEP_RUNNING" = "true" ]; then
            echo "Disabling automatic stop for $ECS_SERVICE_NAME"
          
            aws ecs tag-resource \
              --region eu-west-1 \
              --resource-arn "$SERVICE_ARN" \
              --tags key=HARJA_AUTOSS_IGNORE,value=true
          else
            echo "Enabling automatic stop for $ECS_SERVICE_NAME"
          
            aws ecs untag-resource \
              --region eu-west-1 \
              --resource-arn "$SERVICE_ARN" \
              --tag-keys HARJA_AUTOSS_IGNORE
          fi

  # Raportoi osittain onnistuneen ajon: kanta on migroitu, mutta sovellusta ei deployattu.
  # Eli, deployment on jäänyt tilaan jossa kannassa on uusi versio, mutta sovellus ei ole päivitetty.
  # Ajetaan vain, jos jokin jobi epäonnistui tai peruutettiin JA migraatio ehti onnistua.
  report:
    name: "Report partial deployment to ${{ inputs.environment }}"
    needs:
      - preflight
      - build
      - image
      - database
      - deploy
    if: ${{ (failure() || cancelled()) && needs.database.outputs.migrated == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions: {}

    steps:
      - name: '[Test-envs] Report migrated database without deployment'
        env:
          COMMIT_SHA: ${{ needs.preflight.outputs.commit_sha }}
          ENVIRONMENT: ${{ inputs.environment }}
          BUILD_RESULT: ${{ needs.build.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          MESSAGE="Migraatiot on ajettu, mutta sovellusta ei deployattu. Ympäristössä ${ENVIRONMENT} ajetaan vanhaa sovellusversiota uutta skeemaa vasten. Korjaa virhe ja aja workflow uudelleen, tai käytä \"Re-run failed jobs\" -toimintoa, jos virhe oli häiriö."

          echo "::error title=Partial deployment::${MESSAGE}"

          {
            echo "## ⚠️ Osittainen deployment: ${ENVIRONMENT}"
            echo ""
            echo "${MESSAGE}"
            echo ""
            echo "| Job | Tulos |"
            echo "|-----|-------|"
            echo "| build | ${BUILD_RESULT} |"
            echo "| image | ${IMAGE_RESULT} |"
            echo "| database | success (migroitu) |"
            echo "| deploy | ${DEPLOY_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"
