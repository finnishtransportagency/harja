## Testiympäristöjen deployment prosessi
## -> antaa valita branchin
## -> tarkistaa deployment-kohteen ennen buildia
## -> buildaa uberjarin ilman AWS-tunnuksia
## -> buildaa imagen testi ECR:rään (erillään prodista)
## -> deployaa imagen <test-env> ECS konttiin
name: '[Test-envs] Build and deploy'

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Valitse deploy-ympäristö"
        required: true
        type: choice
        options:
          - test-qa1
          - test-qa2
          - test-qa3
          - test-demo
          - test-koulutus
      keep-running:
        description: "Pidä ympäristö käynnissä yön yli?"
        required: true
        type: boolean
        default: false
      skip-migrations:
        description: "Ohita Flyway-migraatiot?"
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ inputs.environment }}-deploy
  cancel-in-progress: false

jobs:

  preflight:
    name: "Preflight ${{ inputs.environment }}"
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-test-env-preflight.yml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit

  build:
    name: "Build branch for ${{ inputs.environment }}"
    needs: preflight
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-test-env-build.yml
    with:
      environment: ${{ inputs.environment }}

  deploy:
    name: "Deploy branch to ${{ inputs.environment }}"
    needs:
      - preflight
      - build
    permissions:
      id-token: write
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-test-env-deploy.yml
    with:
      environment: ${{ inputs.environment }}
      keep-running: ${{ inputs.keep-running }}
      skip-migrations: ${{ inputs.skip-migrations }}
      service-arn: ${{ needs.preflight.outputs.service_arn }}
      commit-sha: ${{ needs.build.outputs.commit_sha }}
      ref-tag: ${{ needs.build.outputs.ref_tag }}
    secrets: inherit
