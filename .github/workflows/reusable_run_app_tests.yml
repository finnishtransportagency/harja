###
# Ajaa Harja-sovelluksen testipatterin, sekä yrittää tehdä buildin (e2e-testejä varten)
###

# Security hardening for GitHub Actions
# https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-third-party-actions

name: '[Reusable] Run app tests'

on:
  workflow_call:
    inputs:
      test-db-service:
        # Katso saatavilla olevat harjadb servicet docker-compose.yml:stä (esim. harjadb-latest)
        description: 'Testeissä käytettävän testitietokannan docker compose servicen nimi'
        type: string
        required: true
      e2e-browsers:
        description: 'E2E-testeissä testattavat selaimet (JSON)'
        default: "['chrome']"
        type: string
        required: false
      artifact-prefix:
        description: 'Optional prefix tämän jobin uploadaamien/downloadaamien artifactien nimeen. Tarpeellinen, jos tätä jobia kutsutaan esim. matrix-strategialla.'
        default: ''
        type: string
        required: false
      build-harja:
        description: 'Buildataanko harja kevyesti ("light") vai täysi build ("full") tai ei ollenkaan "false"'
        default: 'full'
        type: string
        required: false
      scan-docker-image:
        description: 'Enabloi scan-docker-image job'
        default: 'true'
        type: string
        required: false
      deps-tree:
        description: 'Enabloi deps-tree job'
        default: 'true'
        type: string
        required: false
      lint-clj:
        description: 'Enabloi lint-clj job'
        default: 'true'
        type: string
        required: false
      validate-oikeudet-edn:
        description: 'Enabloi validate-oikeudet-edn job'
        default: 'true'
        type: string
        required: false
      backend-tests:
        description: 'Enabloi back-tests job'
        default: 'true'
        type: string
        required: false
      slow-tests:
        description: 'Enabloi slow-tests job'
        default: 'true'
        type: string
        required: false
      front-end-tests:
        description: 'Enabloi front-end-tests job'
        default: 'true'
        type: string
        required: false
      integration-tests:
        description: 'Enabloi integration-tests job'
        default: 'true'
        type: string
        required: false
      e2e-tests:
        description: 'Enabloi e2e-tests job'
        default: 'true'
        type: string
        required: false


# Aseta least-privilege default permissionit workflowille
# Job-kohtaiset oikeudet määritellään jobeissa erikseen
permissions: {}

env:
  GH_DOCKER_REGISTRY: ghcr.io

jobs:
  # Tulosta Clojure deps tree, jotta voidaan nähdä riippuuvuuksien hierarkia PR:ssä
  deps-tree:
    if: ${{ inputs.deps-tree == 'true' }}
    name: "Print Clojure deps tree"
    runs-on: ubuntu-latest
    permissions:
      # Contents read lupaa tarvitaan checkout actionissa
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Estä turha kredentiaalien tallennus levylle (tietoturva)
          persist-credentials: false

      - name: Setup clojure environment
        uses: ./.github/actions/setup-build-env-and-tools

      # https://github.com/clj-kondo/clj-kondo/blob/master/doc/ci-integration.md
      - name: Lein deps :tree
        continue-on-error: true
        run: lein with-profile +pedantic-warn deps :tree
        #run: lein with-profile +pedantic-abort deps :tree

  # Linter job
  lint-clj:
    if: ${{ inputs.lint-clj == 'true' }}
    name: "Lint Clojure"
    runs-on: ubuntu-latest
    # README: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#permissions-for-the-github_token
    permissions:
      # Contents read lupaa tarvitaan checkout actionissa
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Estä turha kredentiaalien tallennus levylle (tietoturva)
          persist-credentials: false

      - name: Setup clojure environment
        uses: ./.github/actions/setup-build-env-and-tools

      - name: Setup test tools
        uses: ./.github/actions/setup-test-tools
        with:
          clj-kondo: 2023.07.13

      # https://github.com/clj-kondo/clj-kondo/blob/master/doc/ci-integration.md
      - name: Lint
        continue-on-error: true
        run: clj-kondo --lint src --config '{:output {:pattern "::{{level}} file={{filename}},line={{row}},col={{col}}::{{message}}"}}'

  # Validoi että oikeudet EDN-tiedostot ovat ajan tasalla
  validate-oikeudet-edn:
    if: ${{ inputs.validate-oikeudet-edn == 'true' }}
    name: "Validoi oikeudet EDN-tiedostot"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Estä turha kredentiaalien tallennus levylle (tietoturva)
          persist-credentials: false

      - name: Setup clojure environment
        uses: ./.github/actions/setup-build-env-and-tools

      - name: Generoi EDN-tiedostot uudelleen
        run: lein run -m harja.tyokalut.oikeudet-edn-export

      - name: Tarkista että EDN-tiedostot ovat ajan tasalla
        run: |
          if ! git diff --quiet resources/roolit.edn resources/oikeudet.edn; then
            echo "❌ EDN-tiedostot eivät ole ajan tasalla Excelin kanssa!"
            echo ""
            echo "Excel-tiedosto resources/roolit.xlsx on muuttunut, mutta"
            echo "EDN-tiedostot (roolit.edn ja oikeudet.edn) eivät ole päivitetty."
            echo ""
            echo "Korjaa ongelma JOKO:"
            echo ""
            echo "1️⃣  Käynnistä Harja uudelleen paikallisesti (SUOSITUS):"
            echo "    - EDN:t generoidaan automaattisesti käynnistyksessä"
            echo "    - Katso lokista: ✅ Oikeudet-EDN:t generoitu onnistuneesti"
            echo "    - Committaa: git add resources/*.edn && git commit -m \"Päivitä oikeudet\""
            echo ""
            echo "2️⃣  TAI aja manuaalinen komento:"
            echo "    lein run -m harja.tyokalut.oikeudet-edn-export"
            echo "    git add resources/roolit.edn resources/oikeudet.edn"
            echo "    git commit -m \"Päivitä oikeudet\""
            echo ""
            echo "Muutokset:"
            git diff resources/roolit.edn resources/oikeudet.edn
            exit 1
          fi
          echo "✅ EDN-tiedostot ovat ajan tasalla"

  # Build job
  build-harja:
    if: ${{ inputs.build-harja != 'false' }}
    name: "Prod build"
    runs-on: ubuntu-latest
    # README: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#permissions-for-the-github_token
    permissions:
      contents: read # Tarvitaan checkout actionissa
      packages: read # Tarvitaan Docker imageiden pullamiseen GH Container Registrystä
      actions: write # Tarvitaan artifactien listaamiseen ja poistamiseen

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Estä turha kredentiaalien tallennus levylle (tietoturva)
          persist-credentials: false

      # Käynnistetään testitietokanta docker-kontti, jota tarvitaan testien ajamiseen ja Harjan buildaamiseen
      - name: Start test database
        uses: ./.github/actions/start-test-db
        env:
          TEST_DB_SERVICE: ${{ inputs.test-db-service }}
        with:
          registry: ${{ env.GH_DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          service-name: ${{ env.TEST_DB_SERVICE }}

       # Huom: Build-action tarvitsee testitietokannan taustalle ennen buildin ajoa

      # Kevyestä buildistä on jätetty laadunseurannan ja dokumentaation build pois
      - name: Build Harja Uberjar (Kevyt)
        if: ${{ inputs.build-harja == 'light' }}
        uses: ./.github/actions/build-harja-app
        with:
          build-laadunseuranta: 'false'

      - name: Build Harja Uberjar (Täysi build)
        if: ${{ inputs.build-harja == 'full' }}
        uses: ./.github/actions/build-harja-app

      - name: Name build artifact using the branch name
        id: artifact-name
        env:
          REF: ${{ github.ref }}
          NAME_PREFIX: ${{ inputs.artifact-prefix }}
          # Branchin nimen "/"-merkit muunnetaan "-"-merkeiksi, ja muodostetaan branchiin pohjautuva nimi
        run: echo "value=${NAME_PREFIX}${REF////-}-uberjar" >> $GITHUB_OUTPUT

      - name: Delete old branch build artifacts (only the latest is needed)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: artifact
        env:
          ARTIFACT_NAME: ${{ steps.artifact-name.outputs.value }}
        with:
          script: |
            const res = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })

            res.data.artifacts
              .filter(({ name }) => name === process.env.ARTIFACT_NAME)
              .forEach(({ id }) => {
                github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: id,
                })
              })

      - name: Upload a new build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-name.outputs.value }}
          path: ./target/harja-0.0.1-SNAPSHOT-standalone.jar
          if-no-files-found: error
          retention-days: 1

  scan-docker-image:
    if: ${{ inputs.scan-docker-image == 'true' }}
    name: "Scan Docker image"
    runs-on: ubuntu-latest
    needs: build-harja
    permissions:
      contents: read # Tarvitaan checkout actionissa
      packages: read # Tarvitaan Docker imageiden pullamiseen GH Container Registrystä
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Estä turha kredentiaalien tallennus levylle (tietoturva)
          persist-credentials: false

      - name: Get the build artifact name
        id: artifact-name
        env:
          REF: ${{ github.ref }}
          NAME_PREFIX: ${{ inputs.artifact-prefix }}
          # Branchin nimen "/"-merkit muunnetaan "-"-merkeiksi, ja muodostetaan branchiin pohjautuva nimi
        run: echo "value=${NAME_PREFIX}${REF////-}-uberjar" >> $GITHUB_OUTPUT

      - name: Download uberjar artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.artifact-name.outputs.value }}
          # Download to the same directory as the uberjar is built to
          path: ./target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.GH_DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag Harja app test image
        id: build-test-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKERFILE_PATH: 'aws/fargate/Dockerfile'
          BUILD_PLATFORMS: linux/amd64
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          platforms: ${{ env.BUILD_PLATFORMS }}
          tags: harja_buildtest_pr:${{ env.IMAGE_TAG }}
          # Disabloi provenance attestations: https://github.com/docker/build-push-action/issues/820
          provenance: false
          # Lataa buildattu image paikallisesti 'docker images':iin tämän jobin käyttöön
          load: true

      - name: Run Trivy vulnerability scanner
        uses: ./.github/actions/scan-docker-image
        env:
          DOCKERFILE_PATH: 'aws/fargate/Dockerfile'
          TRIVY_IGNORES_PATH: 'aws/fargate/.trivyignore'
        with:
          # Hae viittaus buildattuun imageen build-test-image stepin outputeista
          image-ref: ${{ steps.build-test-image.outputs.imageid }}
          dockerfile-path-for-sarif: ${{ env.DOCKERFILE_PATH }}
          trivyignores: ${{ env.TRIVY_IGNORES_PATH }}
          # Failataan jobi, jos löytyy kriittisiä tai korkeita haavoittuvuuksia
          # TODO: Laitetaan HIGH fail päälle, kunhan kaikki HIGH-tason hälytykset on käsitelty pois ja normaali baseline muodostettu
          #       Tällä hetkellä fail aiheuttaa PR:issä turhia hälytyksiä
          #       Critical-tason hälytykset on käsitelty ja uusien critical-havaintojen seuranta voidaan aloittaa.
          fail-job-on-severities: 'CRITICAL'
          #fail-job-on-severities: 'CRITICAL,HIGH'
          ignore-unfixed: true
          # Disabloi upload-sarif-as-artifact, koska sarif uploadataan develop-branchin testien yhteydessä
          upload-sarif-as-artifact: false

  backend-tests:
    if: ${{ inputs.backend-tests == 'true' }}
    name: "Backend-testit (shard ${{ matrix.shard }})"
    runs-on: ubuntu-latest
    env:
      TZ: "EET"
    strategy:
      # fail-fast: false → kaikki shardit ajetaan, vaikka joku failaisi. Jos halutaan nopeampi feedback, vaihda true.
      fail-fast: false
      matrix:
        shard: [1, 2]
    permissions:
      contents: read # Tarvitaan checkout actionissa
      packages: read # Tarvitaan Docker imageiden pullamiseen GH Container Registrystä
      checks: write # Tarvitaan test-reportin julkaisuun PR:ssä

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Estä turha kredentiaalien tallennus levylle (tietoturva)
          persist-credentials: false

      # Käynnistetään testitietokanta docker-kontti, jota tarvitaan testien ajamiseen
      - name: Start test database
        uses: ./.github/actions/start-test-db
        env:
          TEST_DB_SERVICE: ${{ inputs.test-db-service }}
        with:
          registry: ${{ env.GH_DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          service-name: ${{ env.TEST_DB_SERVICE }}

      - name: Setup clojure environment
        uses: ./.github/actions/setup-build-env-and-tools

      - name: Verify CI JVM options
        run: |
          echo "::group::JVM-optiot CI-profiilista"
          echo "Leiningen projektin :jvm-opts (+ci profiililla):"
          lein with-profile +ci pprint :jvm-opts
          echo "::endgroup::"
        shell: bash

      - name: Run backend tests (shard ${{ matrix.shard }})
        # CI-profiili (profiles.clj :ci) yliajaa :jvm-opts suuremmalla heapilla ja G1GC:llä.
        # LEIN_JVM_OPTS ei vaikuta projekti-JVM:iin koska project.clj:ssä on :jvm-opts ^:replace.
        # Shard-selektorit (:shard-1/2/3) on määritelty project.clj:ssä ja jakavat testit
        # namespacen nimen hashin perusteella kolmeen tasakokoiseen ryhmään.
        run: lein with-profile +ci test2junit :shard-${{ matrix.shard }}

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        env:
          NAME_PREFIX: ${{ inputs.artifact-prefix }}
        if: always()
        with:
          report_paths: 'test2junit/xml/*.xml'
          require_passed_tests: true
          check_name: 'Test Report: ${{ env.NAME_PREFIX }}Backend (shard ${{ matrix.shard }})'
          # https://github.com/mikepenz/action-junit-report/issues/40#issuecomment-1607743568
          # Kiertotie sille, että test result checkit menevät väärän workflown tuloksiin
          # develop-branchin mergen tai muun samantyyppisesti triggeröityjen workflowien kohdalla
          detailed_summary: true

# Alkuperäinen rinnakkaistamaton backend-testien ajo
# TODO: Poista, jos shardattu ajo toimii riittävän hyvin
