# TODO: Toteuta cypress-image, jota ajetaan taustalla. Ota mallia .github/docker imageista.
#
#       Tallenna cypress image .github/docker polkuun ja lähetä image Harjan repon Container Registryyn
#
#       Cypressillä on myös hyviä omia pohja-imageita, joita voi käyttää: https://github.com/cypress-io/cypress-docker-images
#
#       Muista käyttää yhteistä docker-composessa määriteltyä harja_net verkkoa
#          Katso: .github/docker-compose.yml

name: 'Start Cypress'
description: 'Käynnistää Cypress kontin ja ajaa komennon sen sisällä kerran'

inputs:
  registry:
    description: 'Container registry, josta haetaan cypress kontin image'
    required: true
    default: 'ghcr.io'
  username:
    description: ''
    required: true
  password:
    description: ''
    required: true
  image:
    description: 'Cypress kontin imagen nimi'
    required: false
    default: ghcr.io/finnishtransportagency/harja_cypress:latest
  GITHUB_WORKSPACE:
    description: 'Github jobin workspace path. Tämä mountataan cypress kontin sisälle.'
    required: true
  browser:
    description: 'Selain, jota vasten testit ajetaan. Cypress-konttiin asennetut selaimet: chrome, edge'
    default: 'chrome'
    required: false


runs:
  using: "composite"
  steps:
    - name: Log in to the Container registry
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Pull image
      env:
        IMAGE_NAME: ${{ inputs.image }}
      run: |
        echo "Pulling harja cypress image"
        docker pull "$IMAGE_NAME"
      shell: bash

    # Konttiin mountataan /harja workdirectoryyn GITHUB_WORKSPACE, joka sisältää jobin checkoutissa haetun sisällön
    # sekä myöhemmin jobissa ennen mounttia workspaceen lisätyn sisällön, kuten esimerkiksi asennetut NPM-paketit.
    # NOTE: Disabloidaan GPU, käyttämällä ELECTRON_EXTRA_LAUNCH_ARGS asetusta (https://github.com/cypress-io/cypress/issues/25357)
    # GH Actions runner (UID 1001) omistaa workspacen tiedostot.
    # Cypress-kontti ajetaan node-käyttäjänä (UID 1000), joten output-hakemistot
    # täytyy luoda etukäteen kaikille kirjoitettavina.
    # Ks. https://github.com/cypress-io/cypress-docker-images/tree/master/examples/included-as-non-root
    - name: Valmistele cypress output-hakemistot
      env:
        GITHUB_WORKSPACE: ${{ inputs.GITHUB_WORKSPACE }}
      run: |
        for dir in cypress/screenshots cypress/videos cypress/downloads cypress/test-results; do
          mkdir -p "$GITHUB_WORKSPACE/$dir"
          chmod 777 "$GITHUB_WORKSPACE/$dir"
        done
      shell: bash

    # Note: Cypress varoittaa, että wordir /harja ei ole writable: https://github.com/cypress-io/cypress/issues/30810
    #       Tämä ei ole haitallista, kunhan Cypressin tarvitsemat output-hakemistot on luotu writableksi
    - name: Aja cypress-testit
      env:
        IMAGE_NAME: ${{ inputs.image }}
        GITHUB_WORKSPACE: ${{ inputs.GITHUB_WORKSPACE }}
        BROWSER: ${{ inputs.browser }}
      run: |
        echo "Ajetaan cypress komento kontissa käyttäjänä: node"
        
        docker run \
          --network host \
          -u node \
          -e ELECTRON_EXTRA_LAUNCH_ARGS='--disable-gpu' \
          -v $GITHUB_WORKSPACE:/harja \
          -w /harja \
          "$IMAGE_NAME" \
          bash -c "echo -e \"Chrome version:  \$(google-chrome --version) \nEdge version:  \$(edge --version) \n\";
                   echo '-------------------';
                   cypress run --browser $BROWSER"
      shell: bash

