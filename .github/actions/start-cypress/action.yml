name: 'Start Cypress'
description: 'Ajaa Cypress-testit Docker Compose -servicen kertaluonteisessa kontissa'

inputs:
  registry:
    description: 'Container registry, josta haetaan cypress kontin image'
    required: true
    default: 'ghcr.io'
  username:
    description: ''
    required: true
  password:
    description: ''
    required: true
  # Servicen image ja asetukset määritellään .github/docker/docker-compose.yml:ssä.
  service-name:
    description: 'Cypressin compose servicen nimi'
    required: true
  GITHUB_WORKSPACE:
    description: 'Github jobin workspace path. Tämä mountataan cypress kontin sisälle.'
    required: true
  browser:
    description: 'Selain, jota vasten testit ajetaan. Cypress-konttiin asennetut selaimet: chrome, edge'
    default: 'chrome'
    required: false
  spec:
    description: 'Cypress --spec glob-pattern (esim. cypress/e2e/s1_*.cy.js). Tyhjä = aja kaikki testit.'
    default: ''
    required: false


runs:
  using: "composite"
  steps:
    - name: Log in to the Container registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}

    - name: Pull image
      env:
        SERVICE_NAME: ${{ inputs.service-name }}
      run: |
        cd .github/docker
        echo "Docker Compose version: $(docker compose version --short)"
        echo "Pulling Cypress-image for service: ${SERVICE_NAME}"
        docker compose pull "${SERVICE_NAME}"
      shell: bash

    # Konttiin mountataan /harja workdirectoryyn GITHUB_WORKSPACE, joka sisältää jobin checkoutissa haetun sisällön
    # sekä myöhemmin jobissa ennen mounttia workspaceen lisätyn sisällön, kuten esimerkiksi asennetut NPM-paketit.
    # GH Actions runner (UID 1001) omistaa workspacen tiedostot.
    # Cypress-kontti ajetaan node-käyttäjänä (UID 1000), joten output-hakemistot
    # täytyy luoda etukäteen kaikille kirjoitettavina.
    # Ks. https://github.com/cypress-io/cypress-docker-images/tree/master/examples/included-as-non-root
    - name: Prepare cypress output-directories
      env:
        GITHUB_WORKSPACE: ${{ inputs.GITHUB_WORKSPACE }}
      run: |
        for dir in cypress/screenshots cypress/videos cypress/downloads cypress/test-results; do
          mkdir -p "$GITHUB_WORKSPACE/$dir"
          chmod 777 "$GITHUB_WORKSPACE/$dir"
        done
      shell: bash

    # Note: Cypress varoittaa, että wordir /harja ei ole writable: https://github.com/cypress-io/cypress/issues/30810
    #       Tämä ei ole haitallista, kunhan Cypressin tarvitsemat output-hakemistot on luotu writableksi
    - name: Run cypress-tests
      env:
        SERVICE_NAME: ${{ inputs.service-name }}
        GITHUB_WORKSPACE: ${{ inputs.GITHUB_WORKSPACE }}
        BROWSER: ${{ inputs.browser }}
        SPEC: ${{ inputs.spec }}
      run: |
        echo "Running cypress command in the container as user: node"

        cd .github/docker
        docker compose run --rm --no-deps "${SERVICE_NAME}"
      shell: bash
