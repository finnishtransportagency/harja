# HUOM: Tämä Action vaatii, että jobissa on Harjan testitietokanta ajossa ennen kuin tämän actionin ajaa.

name: 'Build Harja'
description: 'Buildaa Harjan osat ja paketoi ne Uberjarriin. Uberjar-paketoinnin yhteydessä käännettään myös backend. Huom: Jobissa täytyy testitietokannan olla ajossa!'

inputs:
  build-front-end:
    description: 'Build front-end'
    default: 'true'
  build-mode:
    description: 'Build-asetus: dev-bundle (nopea, ei optimoitu) tai production (vastaa tuotantoa)'
    default: 'production'
  build-laadunseuranta:
    description: 'Build laadunseuranta'
    default: 'true'
  build-uberjar:
    description: 'Build uberjar'
    default: 'true'

runs:
  using: "composite"
  steps:
    - name: Setup clojure environment and install nodejs deps
      uses: $/.github/actions/setup-build-env-and-tools
      with:
        # Front-endin buildaamisessa tarvitaan nodejs dependencyjä
        install-node-deps: true

    - name: Verify CI JVM options
      run: |
        echo "::group::JVM-optiot CI-profiilista"
        echo "Leiningen projektin :jvm-opts (+ci profiililla):"
        lein with-profile +ci pprint :jvm-opts
        echo "::endgroup::"
      shell: bash

    - name: Build front-end
      if: ${{ inputs.build-front-end == 'true' }}
      env:
        BUILD_MODE: ${{ inputs.build-mode }}
      run: |
        case "$BUILD_MODE" in
          dev-bundle) FRONTEND_ALIAS=compile-dev-bundle ;;
          production) FRONTEND_ALIAS=compile-prod ;;
          *)
            echo "Error: Unknown build-mode '$BUILD_MODE' (allowed values: dev-bundle, production)." >&2
            exit 1
            ;;
        esac

        echo "Building frontend ($BUILD_MODE)..."
        
        echo "Building less styles..."
        npx lessc dev-resources/less/application.less resources/public/css/application.css
        echo "Done."
        
        echo "Copying Bootstrap styles..."
        mkdir -p resources/public/css
        # Jos haluaa noden kautta kokonaisen version:
        # cp node_modules/@tabler/core/dist/css/tabler.min.css resources/public/css/
        cp resources/bootstrap/tabler.min.css resources/public/css/
        cp node_modules/@tabler/icons-webfont/dist/tabler-icons.min.css resources/public/css/
        cp -r node_modules/@tabler/icons-webfont/dist/fonts resources/public/css/
        cp node_modules/@tabler/core/dist/css/tabler-vendors.min.css resources/public/css/
        
        mkdir -p resources/public/js/out
        cp node_modules/bootstrap/dist/js/bootstrap.bundle.min.js resources/public/js/out/
        echo "Done."
        
        echo "Building ClojureScript (lein +ci,+prod-cljs, $FRONTEND_ALIAS)..."
        lein with-profile +ci,+prod-cljs "$FRONTEND_ALIAS"
        echo "Done."
      shell: bash

    - name: Build laadunseuranta
      if: ${{ inputs.build-laadunseuranta == 'true' }}
      run: |
        echo "Building laadunseuranta (with lein default profiles + ci + laadunseuranta-prod)"
        lein with-profile +ci,+laadunseuranta-prod compile-laadunseuranta-prod
      shell: bash

    - name: Build uberjar
      if: ${{ inputs.build-uberjar == 'true' }}
      # Uberjar-profiilin :aot :all kääntää backendin tässä vaiheessa.
      # CI-profiili (profiles.clj :ci) yliajaa :jvm-opts suuremmalla heapilla ja G1GC:llä.
      # LEIN_JVM_OPTS ei vaikuta projekti-JVM:iin koska project.clj:ssä on :jvm-opts ^:replace.
      run: |
        echo "Building uberjar"
        lein with-profile +ci uberjar
      shell: bash
