name: 'Setup build environment and build tools'
description: 'Asentaa clojure-kehitys ympäristön ja buildaamiseen liittyviä työkalua'

inputs:
  setup-java:
    description: 'Asenna java? Javan versio määritellään .github/.java-version tiedostossa.'
    # Huom, composite actionit eivät tue tyyppimäärityksiä inputeille, joten boolean esitetään tässä stringinä.
    default: 'true'
  install-leiningen:
    description: 'Asennettavan leiningenin versio (esim. "2.9.8", "stable" tai "latest"). Aseta "false", jos ei asenneta.'
    default: 'stable'
  install-clojure-deps:
    description: 'Asenna clojure dependencyt?'
    default: 'true'
  setup-node:
    description: 'Asennetaanko NodeJS? Käytettävä NodeJS-versio määritellään package.json "engines" kentässä.'
    default: 'false'
  install-node-deps:
    description: 'Asennetaanko nodejs dependencyt? (less.js ym.)'
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Setup Java
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      if: ${{ inputs.setup-java == 'true' }}
      with:
        distribution: 'temurin'
        java-version-file: './.github/.java-version'
        check-latest: true

    - name: Cache Leiningen
      id: cache-leiningen
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ inputs.install-leiningen != 'false' }}
      with:
        # Cachetetaan lein-skriptin lisäksi myös sen lataama standalone-jar, jotta sitä ei ladata joka ajossa uudelleen.
        path: |
          /usr/local/bin/lein
          ~/.lein/self-installs
        key: ${{ runner.os }}-lein-${{ inputs.install-leiningen }}

    - name: Prepare Leiningen
      if: ${{ inputs.install-leiningen != 'false' && steps.cache-leiningen.outputs.cache-hit != 'true' }}
      env:
        LEIN_VERSION: ${{ inputs.install-leiningen }}
        # Lein-skripti käyttää tätä komentoa standalone-jarin lataamiseen. Lisätään uudelleenyrityksiö verkkovirheiden varalta.
        # Retry suoritetaan kaikkien verkkovirheiden yhteydessä
        HTTP_CLIENT: 'curl --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 -f -L -o'
      run: |
        cd /tmp
        curl --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 -fsSL -o /tmp/lein \
          "https://raw.githubusercontent.com/technomancy/leiningen/${LEIN_VERSION}/bin/lein"
        chmod +x /tmp/lein
        mv -f /tmp/lein /usr/local/bin/lein
        cd -
        lein version
      shell: bash

    - name: Cache Clojure Dependencies
      id: cache-clojure-deps
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ inputs.install-clojure-deps == 'true' }}
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-leiningen-deps-${{ hashFiles('**/project.clj', '**/profiles.clj') }}

    - name: Download Clojure dependencies
      if: ${{ inputs.install-clojure-deps == 'true' && steps.cache-clojure-deps.outputs.cache-hit != 'true' }}
      env:
        # Lein-skripti käyttää tätä komentoa kyselyiden tekemiseen, lisätään uudelleenyrityksiö verkkovirheiden varalta.
        # Retry suoritetaan kaikkien verkkovirheiden yhteydessä
        HTTP_CLIENT: 'curl --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 -f -L -o'
      # Maven-repot (esim. repo.osgeo.org) palauttavat joskus 5xx-virheitä, joten latausta yritetään uudelleen.
      # Uusintayrityksissä käytetään Leiningenin sisäänrakennettua +update-profiilia (:update :always), jotta
      # Maven-resolver ei ohita aiemmin epäonnistuneita latauksia (.lastUpdated-tiedostot ~/.m2:ssa).
      # Profiilin määrittely: default-profiles, :update {:update :always}
      # https://github.com/technomancy/leiningen/blob/2.12.0/leiningen-core/src/leiningen/core/project.clj
      # Jo ladattuja release-artifakteja ei ladata uudelleen.
      run: |
        hae_riippuvuudet() {
          local profiilit="$1"
          local yrityksia=5
          local odotus=15

          for yritys in $(seq 1 "$yrityksia"); do
            local kaytettavat_profiilit="$profiilit"
            if [ "$yritys" -gt 1 ]; then
              kaytettavat_profiilit="${profiilit:+${profiilit},}+update"
            fi

            if [ -z "$kaytettavat_profiilit" ]; then
              lein deps && return 0
            else
              lein with-profile "$kaytettavat_profiilit" deps && return 0
            fi

            if [ "$yritys" -lt "$yrityksia" ]; then
              echo "::warning::Dependency download failed (attempt ${yritys}/${yrityksia}). Retrying in ${odotus} s."
              sleep "$odotus"
              odotus=$((odotus * 2))
            fi
          done

          echo "::error::Dependency download failed after ${yrityksia} attempts."
          return 1
        }

        # Oletusprofiilien riippuvuudet
        hae_riippuvuudet ""
        # Testiprofiilit: PhantomJS-profiili korvaa osan oletusprofiilien kirjastoversioista vanhemmilla.
        hae_riippuvuudet "+test,+phantomjs"
      shell: bash

    # FIXME: delaguardo/setup-clojure@1c76ab0e154379260d7a6ea16b413679abe46785 is not allowed to be used in finnishtransportagency/harja.
    #        Actions in this workflow must be: within a repository that belongs to your Enterprise account, created by GitHub,
    #        verified in the GitHub Marketplace, or matching the following: haya14busa/action-bumpr@e184f8e5aa9d5045eb9f8194fc0977e723100d41.
    # https://github.com/DeLaGuardo/setup-clojure
#    - name: Install clojure tools
#      uses: DeLaGuardo/setup-clojure@1c76ab0e154379260d7a6ea16b413679abe46785 # versio 11
#      if: ${{ inputs.install-tools }} == 'true'
#      with:
#        #lein: 2.9.8

    - name: Setup Node.js and NPM (versions defined in package.json "engines")
      if: ${{ inputs.setup-node == 'true' || inputs.install-node-deps == 'true' }}
      uses: $/.github/actions/setup-node-and-npm
      with:
        # Halutaan täysi kontrolli cachettamista, joten ei käytetä actionin omaa cachetusta
        package-manager-cache: false

    # https://www.voorhoede.nl/en/blog/super-fast-npm-install-on-github-actions/
    - name: Cache NPM packages
      id: cache-npm
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ inputs.install-node-deps == 'true' }}
      with:
        # Cypress cachettaa binaryn omaan pathiin, https://docs.cypress.io/app/references/advanced-installation#Binary-cache
        path: | 
          ~/.npm
          ~/.cache/Cypress
        key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
        # TODO: Testaa onko "restore-keys" enää tarpeen. Kommentoitu pois toistaiseksi.
        #       Halutaan, että uusi cache tallennetaan mikäli package-lock.json muuttuu, ja nyt sellaista ei
        #       ole tapahtunut vuoteen kun "restore-keys" asetus on ollut käytössä.
        # Mikäli package-lock.json muuttuu, käytetään kuitenkin vanhentunutta npm-cachea pohjana uudelle cachelle
        #restore-keys: ${{ runner.os }}-npm-

    - name: Install node dependencies from package-lock.json (dependencies & devDependencies)
      if: ${{ inputs.install-node-deps == 'true' }}
      # NPM ci:tä pitää kutsua vaikka ~/.npm yleinen cache löytyykin. Komento npm ci asentaa package-lock.jsonissa
      # määritellyt moduulit workspacen node_modules kansioon, mutta cachettaa ladatut paketit ~/.npm cacheen.
      # Tämän vuoksi cache-hit tietoa ei tarkasteta ehtolauseessa.
      # Huom: Projektin .npmrc sisältää ignore-scripts=true, mutta käytetään asetusta tässä eksplisiittisesti
      run: |
        npm ci --ignore-scripts
      shell: bash
