# Tätä docker-compose-fileä käytetään githubin actionseissa esimerkiksi testitietokannan helpompaan käynnistämiseen
# Samalla varmistetaan, että tarvittavat ympäristömuuttujat on asetettu ja oikeat volumet on mountattu.
# Tämä tiedosto on tarkoitettu käytettäväksi vain Github Actionseissa

networks:
  harja_net:
    driver: bridge
    # Estetään IPv6 käyttö, jotta testitietokannan migraatioiden ajossa ei tule yhteysongelmia
    enable_ipv6: false

services:
  # -- Harjadb --
  # Uusin saatavilla oleva testietiekannan konfiguraatio
  harjadb-latest:
    # Hae latest image GitHubin container registrystä
    image: ghcr.io/finnishtransportagency/harja_harjadb:15.18-3.3.3-trixie@sha256:c8600da7858e5fe857751c7d4b9dbde58680fb73c5d7c92de9064ed624ccbcca

    # Alla saatavilla olevia versioita
    # https://github.com/finnishtransportagency/harja/pkgs/container/harja_harjadb/versions
    #image: ghcr.io/finnishtransportagency/harja_harjadb:15.18-3.3.3 (uusin vakaa)
    #image: ghcr.io/finnishtransportagency/harja_harjadb:15.4-3.3.3

    container_name: harjadb
    networks:
      - harja_net
    environment:
      HARJA_TIETOKANTA_PORTTI: 5432
    ports:
      - "127.0.0.1:5432:5432"
    # Estetään IPv6 käyttö, jotta testitietokannan migraatioiden ajossa ei tule yhteysongelmia
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    # Huom: Mountissa viitataan Harja-repon juuressa olevaan tietokanta-hakemistoon, jossa migraatiotiedostot ovat.
    volumes:
      - ../../tietokanta:/var/lib/postgresql/harja/tietokanta
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "harja", "-d", "harja"]
      interval: 10s
      retries: 5
      start_period: 20s
      # Tarkista start_periodin aikana sekunnin välein, jotta 'docker compose up --wait' ei odota turhaan.
      # Vaatii Docker Engine >= 25 ja Compose >= 2.20.2.
      start_interval: 1s
      timeout: 10s

  # NOTE: Testattavia imagen versiota varten voi tarvittaessa lisätä tähän omia compose konfiguraatioita, koska
  # imagen versioissa healthcheck, volumet ym. asetukset voivat muuttua. Tällöin image vaatii erilaisen konfiguraation.

  # -- Cypress --
  cypress-latest:
    image: ghcr.io/finnishtransportagency/harja_cypress:latest@sha256:7eb79a7402ecaed788beadbc98602b7d88d8a26a83708a75ce6bd15ce1f2c375
    # Harja käynnistetään runnerilla, joten localhost-yhteydet tarvitsevat host-verkon.
    network_mode: host
    user: node
    working_dir: /harja
    environment:
      ELECTRON_EXTRA_LAUNCH_ARGS: "--disable-gpu"
      CYPRESS_VIDEO: "false"
      BROWSER: "${BROWSER:-chrome}"
      SPEC: "${SPEC:-}"
    volumes:
      - "${GITHUB_WORKSPACE:-../..}:/harja"
    command:
      - bash
      - -c
      - |
        echo -e "Chrome version:  $$(google-chrome --version)\nEdge version:  $$(edge --version)\n";
        echo "-------------------";
        if [ -n "$$SPEC" ]; then
          cypress run --browser "$$BROWSER" --spec "$$SPEC";
        else
          cypress run --browser "$$BROWSER";
        fi

  # -- ActiveMQ --
  # Uusi ActiveMQ Artemis broker
  activemq-artemis-itmf:
    image:  ghcr.io/finnishtransportagency/harja_activemq_artemis:latest@sha256:e70ee7ef8c6e34ed1ea9e5fdd86406e49e8892740729c44ca1cb77e29e20f485
    container_name: activemq-artemis-itmf
    networks:
      - harja_net
    environment:
      TZ: "EET"
      EXTRA_ARGS: "--http-host 0.0.0.0 --relax-jolokia --default-port 61616 --http-port 8161"
    ports:
      - "127.0.0.1:61616:61616" # broker
      - "127.0.0.1:8161:8161"   # web

    # Estetään IPv6 käyttö, jotta testitietokannan migraatioiden ajossa ei tule yhteysongelmia
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    healthcheck:
      test: /var/lib/artemis-instance/bin/artemis check node --up --user admin --password admin --url "tcp://127.0.0.1:61616" | grep "success"
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 10s
